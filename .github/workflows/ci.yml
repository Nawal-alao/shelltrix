name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : les tests de supply-chain (H1) vérifient que
          # la référence pinnée existe et porte bien les correctifs de
          # durcissement. Inopérant sur un clone superficiel.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short

      - name: Verify imports
        run: |
          python -c "from shelltrix.app import ShelltrixApp; print('Import OK')"

      - name: Build package and verify wheel contents
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")
          assert wheel, "no wheel built"
          with zipfile.ZipFile(wheel[0]) as z:
              names = z.namelist()
          assert any(n.endswith("app.tcss") for n in names), "app.tcss missing from wheel"
          print("Wheel contains app.tcss: OK")
          PY
