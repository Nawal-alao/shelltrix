name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    # The Rust core is optional at runtime, so the `test` job above runs
    # without it (and the parity tests skip). This job is what keeps the Rust
    # side honest: unit tests, wheel build, import, and parity against the
    # Python implementation. It runs on a single Python version on purpose —
    # abi3-py310 means one wheel covers 3.10 to 3.14, so the interesting
    # matrix is per platform, not per minor (see the release workflow).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: shelltrix-core/target
          key: cargo-${{ hashFiles('shelltrix-core/Cargo.lock') }}

      - name: Rust unit tests
        working-directory: shelltrix-core
        run: cargo test --locked

      - name: Clippy and formatting
        working-directory: shelltrix-core
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the abi3 wheel and install it
        working-directory: shelltrix-core
        run: |
          pipx run maturin build --release --out dist
          pip install dist/*.whl

      - name: The extension imports and answers
        run: |
          python - <<'PY'
          import shelltrix_core
          assert shelltrix_core.core_version(), "no core version"
          print("Rust core importable:", shelltrix_core.core_version())
          PY

      - name: Parity with the Python core
        run: |
          pip install -e ".[dev]"
          python - <<'PY'
          from shelltrix._core import rust_available, selected_backend
          assert rust_available(), "the wheel is installed but not importable"
          print("selected backend:", selected_backend())
          PY
          # The parity tests are the contract; they must not silently skip.
          pytest tests/test_rust_core.py -v -rs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the supply-chain tests (H1) check that the pinned
          # ref exists and does carry the hardening fixes. Ineffective on a
          # shallow clone.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short

      - name: Verify imports
        run: |
          python -c "from shelltrix.app import ShelltrixApp; print('Import OK')"

      - name: Build package and verify wheel contents
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")
          assert wheel, "no wheel built"
          with zipfile.ZipFile(wheel[0]) as z:
              names = z.namelist()
          assert any(n.endswith("app.tcss") for n in names), "app.tcss missing from wheel"
          print("Wheel contains app.tcss: OK")
          PY
