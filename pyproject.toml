[project]
name = "nerve"
version = "0.2.0"
description = "Un client Matrix TUI premium, en Python, basé sur matrix-nio + Textual."
requires-python = ">=3.10"
dependencies = [
    "matrix-nio[e2e]>=0.25.2",
    "textual>=0.60.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nerve = "nerve.app:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nerve = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
