[package]
name = "shelltrix-core"
version = "0.1.0"
edition = "2021"
# 1.96 is matrix-sdk's MSRV, not a preference: the transport cannot build
# below it. Lower it only once matrix-sdk reaches 1.0 and relaxes this.
rust-version = "1.96"
description = "Rust core of shelltrix: Matrix transport and E2EE"
license = "MIT"
publish = false

[lib]
name = "shelltrix_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310: one wheel serves CPython 3.10 through 3.14, so the CI wheel
# matrix stays at one entry per platform instead of one per (platform, minor).
#
# `extension-module` is NOT enabled here: it tells PyO3 not to link libpython,
# which is what a built wheel wants but breaks `cargo test`. Maturin turns it
# on at build time (see pyproject.toml), so both work.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = "1"

# The transport. matrix-sdk brings its own Tokio, so `rt-multi-thread` here is
# about the thread that owns the runtime, not about concurrency of our own.
matrix-sdk = "0.19"
# Pinned to the version matrix-sdk 0.19.1 resolves, and needed directly for the
# `/sync` filter: Synapse only sends `m.typing` when the filter names it, and
# `SyncSettings::filter` takes ruma's type rather than raw JSON. matrix-sdk
# re-exports almost nothing of ruma, so this cannot be reached without it.
ruma = { version = "=0.17.0", features = ["client-api-c"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
extension-module = ["pyo3/extension-module"]
default = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true