[package]
name = "shelltrix-core"
version = "0.1.0"
edition = "2021"
# 1.96 is matrix-sdk's MSRV, not a preference: the transport cannot build
# below it. Lower it only once matrix-sdk reaches 1.0 and relaxes this.
rust-version = "1.96"
description = "Rust core of shelltrix: Matrix transport and E2EE"
license = "MIT"
publish = false

[lib]
name = "shelltrix_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310: one wheel serves CPython 3.10 through 3.14, so the CI wheel
# matrix stays at one entry per platform instead of one per (platform, minor).
#
# `extension-module` is NOT enabled here: it tells PyO3 not to link libpython,
# which is what a built wheel wants but breaks `cargo test`. Maturin turns it
# on at build time (see pyproject.toml), so both work.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = "1"

# The transport. matrix-sdk brings its own Tokio, so `rt-multi-thread` here is
# about the thread that owns the runtime, not about concurrency of our own.
matrix-sdk = "0.19"
# matrix-sdk 0.19.1. Needed directly for two things it does not re-export:
# `RoomLoadSettings` (restoring a saved session) and, with it, the `SessionMeta`
# half of `MatrixSession`. Pinned to the version matrix-sdk resolves so the two
# never disagree about a type.
matrix-sdk-base = "=0.19.1"
# Pinned to the version matrix-sdk 0.19.1 resolves, and needed directly for the
# `/sync` filter: Synapse only sends `m.typing` when the filter names it, and
# `SyncSettings::filter` takes ruma's type rather than raw JSON. matrix-sdk
# re-exports almost nothing of ruma, so this cannot be reached without it.
ruma = { version = "=0.17.0", features = ["client-api-c"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
extension-module = ["pyo3/extension-module"]
# Turns on matrix-sdk's crypto. Off by default: it is a large dependency and
# nothing in the core uses it yet, so enabling it would ship an Olm machine
# with no key store and no way to verify anything — the worst of both. `cargo
# build --features e2e-encryption` is the migration's target, not a default.
e2e-encryption = ["matrix-sdk/e2e-encryption"]
default = []

[dev-dependencies]
# Pinned like the runtime deps above: matrix-sdk-test builds fixtures whose
# types must be the same `Room` and the same events the core handles, so a
# second minor version would not compile rather than merely mismatch.
#
# It is here for one reason. `matrix_sdk_base::room::Room::new` is `pub(crate)`,
# so a room can only reach a client's store through a `/sync` — and a guard that
# refuses to send is worth nothing if the only way to test it is against a
# homeserver nobody runs. `TestClient` replays a canned `/sync` in-process, which
# puts a real encrypted room in a real store and lets the test count the HTTP
# requests the send *would* have made. See `send::tests`.
matrix-sdk-test = "=0.19.1"
# matrix-sdk's own `test_utils`: `test_client_builder` and `set_client_session`
# are the only way to get a logged-in client without a homeserver, and
# `Room::new` being `pub(crate)` means there is no other way to fill a store.
# The `testing` feature is dev-only — Cargo's resolver keeps it out of a
# `cargo build`, so the wheel is unchanged.
matrix-sdk = { version = "0.19", features = ["testing"] }
# To read the mock server's request log, which is how a test proves a send never
# happened rather than only that it returned an error.
wiremock = { version = "0.6.5", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true